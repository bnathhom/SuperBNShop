<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BN Shop Order System</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary-color: #6C63FF;
  --secondary-color: #4A43C9;
  --accent-color: #FF6B9D;
  --success-color: #4CD9B0;
  --warning-color: #FFD166;
  --dark-color: #1A1A2E;
  --darker-color: #16213E;
  --light-color: #F0F4FF;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.2);
  --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
}
body {
  font-family: 'Noto Sans Lao', 'Noto Sans Thai', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, var(--darker-color) 0%, var(--dark-color) 100%);
  color: var(--light-color);
  min-height: 100vh;
}
.navbar {
  background: rgba(26, 26, 46, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--glass-border);
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--glass-shadow);
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.navbar-brand {
  font-size: 1.5rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.navbar-brand i {
  margin-right: 10px;
  color: var(--primary-color);
}
.order-counter {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--glass-bg);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  padding: 8px 15px;
  border-radius: 15px;
  font-weight: bold;
  margin-right: 15px;
  border: 1px solid var(--glass-border);
  transition: all 0.3s ease;
}
.order-counter:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
.order-counter i {
  margin-right: 5px;
  color: var(--primary-color);
}
.courier-counters {
  display: flex;
  gap: 10px;
  color: white;
  background: var(--glass-bg);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  padding: 8px 15px;
  border-radius: 15px;
  font-size: 0.9rem;
  margin-right: 15px;
  border: 1px solid var(--glass-border);
}
.courier-counter {
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.3s ease;
}
.courier-counter:hover {
  transform: scale(1.05);
}
.courier-counter i {
  margin-right: 3px;
  color: var(--success-color);
}
.auth-buttons button {
  margin-left: 10px;
  transition: all 0.3s ease;
}
.container {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 20px;
}
.card {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 15px;
  box-shadow: var(--glass-shadow);
  padding: 25px;
  margin-bottom: 25px;
  border: 1px solid var(--glass-border);
  transition: all 0.3s ease;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}
h1, h2, h3 {
  color: var(--light-color);
  margin-top: 0;
  position: relative;
  display: inline-block;
}
h2::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  width: 50px;
  height: 3px;
  background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
  border-radius: 3px;
}
.btn {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: all 0.5s;
}
.btn:hover::before {
  left: 100%;
}
.btn i {
  margin-right: 8px;
  transition: transform 0.3s ease;
}
.btn:hover i {
  transform: scale(1.2);
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  color: white;
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(108, 99, 255, 0.3);
}
.btn-danger {
  background: linear-gradient(135deg, var(--accent-color), #E85685);
  color: white;
}
.btn-danger:hover {
  background: linear-gradient(135deg, #E85685, var(--accent-color));
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(255, 107, 157, 0.3);
}
.btn-success {
  background: linear-gradient(135deg, var(--success-color), #3AB895);
  color: white;
}
.btn-success:hover {
  background: linear-gradient(135deg, #3AB895, var(--success-color));
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(76, 217, 176, 0.3);
}
.form-control {
  margin-bottom: 20px;
}
.form-control label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: var(--light-color);
}
.form-control input,
.form-control textarea,
.form-control select {
  width: 100%;
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  font-family: 'Noto Sans Lao', 'Noto Sans Thai', sans-serif;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(5px);
  color: var(--light-color);
  transition: all 0.3s ease;
}
.form-control input:focus,
.form-control textarea:focus,
.form-control select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.3);
}
.form-control textarea {
  min-height: 100px;
  resize: vertical;
}
.order {
  border: 1px solid var(--glass-border);
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  position: relative;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(5px);
}
.order:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  border-color: var(--primary-color);
}
.order input[type=checkbox] {
  position: absolute;
  right: 20px;
  top: 20px;
  transform: scale(1.5);
  accent-color: var(--primary-color);
}
.action-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
.print-btns {
  margin-top: 25px;
  text-align: center;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}
.bill {
  width: 76mm;
  height: auto;
  min-height: 130mm;
  padding: 10px;
  font-size: 14px;
  box-sizing: border-box;
  border: 1px solid #000;
  margin: 0 auto;
  overflow: hidden;
  font-family: 'Noto Sans Lao', 'Noto Sans Thai', sans-serif;
  background: white;
}
.logo {
  font-size: 48px;
  font-weight: bold;
  display: inline-block;
  vertical-align: middle;
  margin-right: 10px;
  color: var(--primary-color);
}
.shop-info {
  display: inline-block;
  vertical-align: middle;
  line-height: 1.4;
  white-space: nowrap;
}
.header { margin-bottom: 10px; }
.section { margin-top: 10px; }
.barcode-container {
  text-align: center;
  margin: 15px 0;
}
.barcode-number {
  text-align: center;
  font-family: monospace;
  font-size: 12px;
  margin-top: 5px;
}
.thankyou {
  text-align: center;
  margin-top: 20px;
  font-weight: bold;
}
pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  margin: 0;
  line-height: 1.4;
}
/* Switch + Settings */
.switch-row { display:flex; align-items:center; gap:12px; margin:0 0 18px; padding:12px 15px; border-radius:12px; background:rgba(255,255,255,0.08); border:1px solid var(--glass-border); }
.switch { position:relative; width:52px; height:28px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; top:0; left:0; right:0; bottom:0; background:#555; border-radius:28px; cursor:pointer; transition:.3s; }
.slider::before { content:''; position:absolute; height:22px; width:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.3s; }
.switch input:checked + .slider { background:var(--success-color); }
.switch input:checked + .slider::before { transform:translateX(24px); }
.settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.settings-grid .form-control { margin-bottom:0; }
.settings-grid label { font-size:0.9rem; }
/* Auth Modal */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.7);
  overflow: auto;
  backdrop-filter: blur(5px);
}
.modal-content {
  background: var(--darker-color);
  margin: 5% auto;
  padding: 30px;
  border-radius: 20px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  position: relative;
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px);
}
.close {
  position: absolute;
  right: 20px;
  top: 15px;
  font-size: 24px;
  cursor: pointer;
  color: #aaa;
  transition: color 0.3s ease;
}
.close:hover {
  color: var(--accent-color);
}
.tabs {
  display: flex;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--glass-border);
}
.tab {
  padding: 12px 25px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.3s ease;
  position: relative;
}
.tab.active {
  border-bottom: 3px solid var(--primary-color);
  color: var(--primary-color);
  font-weight: bold;
}
.tab:hover {
  color: var(--primary-color);
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
  animation: fadeIn 0.5s ease;
}
/* Archive Section */
.archive-section {
  display: none;
}
/* Loading Spinner */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s ease-in-out infinite;
  margin-left: 10px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.search-section {
  background: rgba(255, 255, 255, 0.05);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 25px;
  border: 1px solid var(--glass-border);
}
.search-section .form-control {
  margin-bottom: 15px;
}
.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--glass-border);
  padding-bottom: 10px;
}
.order-date {
  font-size: 0.9rem;
  color: #aaa;
}
.customer-data pre {
  background: rgba(255, 255, 255, 0.05);
  padding: 10px;
  border-radius: 8px;
  border-left: 3px solid var(--primary-color);
}
/* Responsive */
@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
    text-align: center;
    padding: 15px;
  }
  .order-counter, .courier-counters {
    margin: 10px 0;
    order: 2;
    width: 100%;
    justify-content: center;
  }
  .courier-counters {
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }
  .auth-buttons {
    margin-top: 15px;
  }
  .print-btns {
    flex-direction: column;
    align-items: center;
  }
  .print-btns .btn {
    width: 100%;
    margin-bottom: 10px;
  }
  .order-header {
    flex-direction: column;
    align-items: flex-start;
  }
  .order-date {
    margin-top: 5px;
  }
}
/* Floating background elements */
.floating-bg {
  position: fixed;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
  opacity: 0.1;
  z-index: -1;
  animation: float 15s infinite linear;
}
.floating-bg:nth-child(1) {
  top: 10%;
  left: 10%;
  width: 300px;
  height: 300px;
  animation-duration: 20s;
}
.floating-bg:nth-child(2) {
  top: 60%;
  right: 10%;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
  animation-duration: 25s;
  animation-direction: reverse;
}
.floating-bg:nth-child(3) {
  bottom: 20%;
  left: 20%;
  width: 150px;
  height: 150px;
  background: radial-gradient(circle, var(--success-color) 0%, transparent 70%);
  animation-duration: 18s;
}
@keyframes float {
  0% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(30px, -30px) rotate(120deg); }
  66% { transform: translate(-20px, 20px) rotate(240deg); }
  100% { transform: translate(0, 0) rotate(360deg); }
}
</style>
</head>
<body>
<!-- Floating background elements -->
<div class="floating-bg"></div>
<div class="floating-bg"></div>
<div class="floating-bg"></div>

<!-- Navbar -->
<div class="navbar">
  <div class="navbar-brand">
    <i class="fas fa-store"></i>
    <span>BN Shop Order System</span>
  </div>
  <div class="order-counter" id="orderCounter">
    <i class="fas fa-shopping-cart"></i> ออเดอร์ปัจจุบัน: <span id="currentOrderCount">0</span>
  </div>
  <div class="courier-counters">
    <div class="courier-counter" data-courier="HAL LOGISTICS">
      <i class="fas fa-truck"></i> HAL: <span>0</span>
    </div>
    <div class="courier-counter" data-courier="Anousith Express">
      <i class="fas fa-truck"></i> Anousith: <span>0</span>
    </div>
    <div class="courier-counter" data-courier="Mixay Express">
      <i class="fas fa-truck"></i> Mixay: <span>0</span>
    </div>
  </div>
  <div class="auth-buttons" id="authButtons">
    <button class="btn btn-primary" onclick="openModal('authModal')">
      <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
    </button>
    <button class="btn btn-success" onclick="openModal('authModal', 'register')">
      <i class="fas fa-user-plus"></i> สร้างบัญชี
    </button>
  </div>
  <div class="user-menu" id="userMenu" style="display: none;">
    <span id="userEmail" style="margin-right: 15px; color: white;"></span>
    <button class="btn btn-success" onclick="showArchive()">
      <i class="fas fa-archive"></i> ดูคลังออเดอร์
    </button>
    <button class="btn btn-danger" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
    </button>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <!-- Current Orders Section -->
  <div id="currentOrdersSection">
    <div class="card">
      <h2><i class="fas fa-plus-circle"></i> เพิ่มออเดอร์ใหม่</h2>
      <div class="form-control">
        <label>ข้อมูลลูกค้า</label>
        <textarea id="customerData" rows="4"></textarea>
      </div>
      <div class="form-control">
        <label>เลือกขนส่ง</label>
        <select id="courier">
          <option value="HAL LOGISTICS">HAL LOGISTICS</option>
          <option value="Anousith Express">Anousith Express</option>
          <option value="Mixay Express">Mixay Express</option>
        </select>
      </div>
      <div class="form-control">
        <label>เบอร์โทรร้าน (เปลี่ยนอัตโนมัติตามขนส่ง)</label>
        <select id="shopPhone" disabled>
          <option value="020 94036226">020 94036226</option>
          <option value="020 98052744">020 98052744</option>
        </select>
      </div>
      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="autoPrintToggle"><span class="slider"></span></label>
        <div>
          <strong>ปริ้นอัตโนมัติ</strong><br>
          <small id="autoPrintHint" style="color:#aaa"></small>
          <div id="autoPrintStatus" style="font-size:0.85rem;color:#aaa"></div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="addOrder()">
        <i class="fas fa-check"></i> ยืนยันออเดอร์
      </button>
    </div>

    <div class="card">
      <h2><i class="fas fa-list"></i> ออเดอร์ทั้งหมด</h2>
      <div style="text-align:center; margin-bottom: 15px;">
        <button class="btn btn-primary" onclick="selectAll(true)">
          <i class="fas fa-check-square"></i> เลือกทั้งหมด
        </button>
        <button class="btn btn-primary" onclick="selectAll(false)">
          <i class="fas fa-square"></i> ยกเลิกทั้งหมด
        </button>
        <button class="btn btn-success" onclick="archiveSelected()">
          <i class="fas fa-archive"></i> เก็บเข้าคลัง
        </button>
      </div>
      <div id="orders"></div>
      <div class="print-btns">
        <button class="btn btn-success" onclick="BTPrint.connect().catch(function(){})">
          <i class="fab fa-bluetooth-b"></i> เชื่อมต่อเครื่องปริ้น
        </button>
        <button class="btn btn-primary" onclick="openPrintSettings()">
          <i class="fas fa-cog"></i> ตั้งค่าการปริ้น
        </button>
        <button class="btn btn-primary" onclick="printSelected()">
          <i class="fas fa-print"></i> พิมพ์ที่เลือก
        </button>
        <button class="btn btn-primary" onclick="printAll()">
          <i class="fas fa-print"></i> พิมพ์ทั้งหมด
        </button>
        <button class="btn btn-danger" onclick="deleteSelected()">
          <i class="fas fa-trash"></i> ลบที่เลือก
        </button>
        <div id="curPrinter" style="width:100%;text-align:center;font-size:0.9rem;color:#aaa"></div>
        <div id="btStatus" style="width:100%;text-align:center;font-size:0.9rem;color:#aaa"></div>
      </div>
    </div>
  </div>

  <!-- Archive Section -->
  <div class="card archive-section" id="archiveSection">
    <h2><i class="fas fa-archive"></i> คลังออเดอร์</h2>
    <button class="btn btn-primary" onclick="backToCurrentOrders()">
      <i class="fas fa-arrow-left"></i> กลับไปออเดอร์ปัจจุบัน
    </button>

    <!-- ส่วนค้นหา -->
    <div class="search-section" style="margin-top: 20px;">
      <div class="form-control">
        <label>ค้นหาออเดอร์</label>
        <input type="text" id="searchOrderId" placeholder="ค้นหาตามเลขออเดอร์ (BN...)">
      </div>
      <div class="form-control">
        <label>ค้นหาตามวันที่</label>
        <div style="display: flex; gap: 10px;">
          <input type="date" id="searchStartDate">
          <span>ถึง</span>
          <input type="date" id="searchEndDate">
        </div>
      </div>
      <button class="btn btn-primary" onclick="searchArchivedOrders()">
        <i class="fas fa-search"></i> ค้นหา
      </button>
      <button class="btn btn-danger" onclick="clearSearch()">
        <i class="fas fa-times"></i> ล้างการค้นหา
      </button>
    </div>

    <div id="archivedOrders" style="margin-top: 20px;"></div>
  </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('authModal')">&times;</span>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">เข้าสู่ระบบ</div>
      <div class="tab" onclick="switchTab('register')">สร้างบัญชี</div>
    </div>

    <div id="loginTab" class="tab-content active">
      <h3>เข้าสู่ระบบ</h3>
      <div class="form-control">
        <label>อีเมล</label>
        <input type="email" id="loginEmail" placeholder="กรอกอีเมลของคุณ">
      </div>
      <div class="form-control">
        <label>รหัสผ่าน</label>
        <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน">
      </div>
      <button class="btn btn-primary" onclick="login()" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
      </button>
      <div id="loginError" style="color: var(--accent-color); margin-top: 10px;"></div>
    </div>

    <div id="registerTab" class="tab-content">
      <h3>สร้างบัญชีใหม่</h3>

<!-- ===== BTPrint: ไลบรารีปริ้นบลูทูธ (รวมอยู่ในไฟล์นี้แล้ว) ===== -->
<script>
/*!
 * BTPrint v3 — ปริ้นจากเว็บไปเครื่องปริ้นบลูทูธ BLE ผ่าน Web Bluetooth
 * รองรับ 2 รุ่น:  'tspl' = QR380A (คำสั่ง TSPL, สติกเกอร์)   'peripage' = PeriPage A6 (กระดาษ 57 มม.)
 * ใช้ได้: Chrome บน Android, หน้าเว็บต้องเป็น https
 *
 *   BTPrint.setProfile('tspl' | 'peripage')   เลือกรุ่นเครื่อง (ถ้าเปลี่ยนรุ่นจะตัดการเชื่อมต่อเดิม)
 *   BTPrint.connect() / ensureConnected() / isConnected()
 *   BTPrint.printElement(el, opts) / printElements([el...], opts) / printCanvas(canvas, opts)
 *   BTPrint.setSpeed('turbo'|'fast'|'normal'|'safe')
 *   BTPrint.onStatus = (msg, isErr) => {...}
 *   opts = { widthMm, heightMm, marginLeftMm, marginRightMm, gapMm }
 */
(function(global){
  'use strict';
  var DOTS_PER_MM = 8; // 203 dpi
  var SERVICES = [
    '0000ff00-0000-1000-8000-00805f9b34fb',
    '0000ffe0-0000-1000-8000-00805f9b34fb',
    '000018f0-0000-1000-8000-00805f9b34fb',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455',
    'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
    '0000fee7-0000-1000-8000-00805f9b34fb'
  ];
  var PRINTERS = {
    tspl: { prefixes: ['QR380', 'QR'], protocol: 'tspl', label: 'QR380A' },
    peripage: {
      prefixes: ['PeriPage', 'Peri'], protocol: 'peripage', label: 'PeriPage A6',
      service: '49535343-fe7d-4ae5-8fa9-9fafd205e455',
      char: '49535343-8841-43f4-a8d4-ecbe34729bb3',
      maxChunk: 20,   // ทดสอบแล้ว: ต้องส่งทีละ 20 ไบต์ (ชุดใหญ่กว่านี้เครื่องไม่ปริ้น)
      minDelay: 4
    }
  };
  var HTML2CANVAS = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  var SPEEDS = {
    turbo:  { chunk: 512, delay: 0 },
    fast:   { chunk: 244, delay: 0 },
    normal: { chunk: 100, delay: 3 },
    safe:   { chunk: 20,  delay: 15 }
  };
  var speed = SPEEDS.turbo, chunkSize = speed.chunk;
  var printer = PRINTERS.tspl, printerKey = 'tspl';

  var device = null, char = null;
  var defaults = { widthMm: 76, heightMm: 130, marginLeftMm: 4, marginRightMm: 2, gapMm: 2 };
  var lock = Promise.resolve();

  function status(msg, isErr){
    if (typeof BTPrint.onStatus === 'function') BTPrint.onStatus(msg, !!isErr);
    else console[isErr ? 'error' : 'log']('[BTPrint] ' + msg);
  }
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  function enqueue(fn){
    var run = lock.then(fn, fn);
    lock = run.catch(function(){});
    return run;
  }

  async function findWritable(server){
    var services = await server.getPrimaryServices();
    for (var s of services){
      var chars = await s.getCharacteristics();
      for (var c of chars){
        if (c.properties.write || c.properties.writeWithoutResponse) return c;
      }
    }
    return null;
  }

  async function pickChar(server){
    if (printer.char){
      try{
        var s = await server.getPrimaryService(printer.service);
        return await s.getCharacteristic(printer.char);
      }catch(e){ /* ใช้วิธีค้นหาอัตโนมัติแทน */ }
    }
    return findWritable(server);
  }

  async function connect(){
    if (!navigator.bluetooth){
      status('เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth (ใช้ Chrome บน Android ผ่าน https)', true);
      throw new Error('no-web-bluetooth');
    }
    try{
      device = await navigator.bluetooth.requestDevice({
        filters: printer.prefixes.map(function(p){ return { namePrefix: p }; }),
        optionalServices: SERVICES
      });
      device.addEventListener('gattserverdisconnected', function(){
        char = null; status('หลุดการเชื่อมต่อ กรุณาเชื่อมต่อใหม่', true);
      });
      status('กำลังเชื่อมต่อ...');
      var server = await device.gatt.connect();
      char = await pickChar(server);
      if (!char) throw new Error('ไม่พบช่องเขียนข้อมูลของเครื่องปริ้น');
      status('เชื่อมต่อแล้ว: ' + device.name);
      return true;
    }catch(e){
      status('เชื่อมต่อไม่สำเร็จ: ' + e.message, true);
      throw e;
    }
  }

  function isConnected(){ return !!(char && device && device.gatt.connected); }

  async function ensureConnected(){
    if (isConnected()) return;
    if (device){
      try{
        var server = await device.gatt.connect();
        char = await pickChar(server);
        if (char){ status('เชื่อมต่อใหม่แล้ว: ' + device.name); return; }
      }catch(e){ /* ให้ผู้ใช้เลือกเครื่องใหม่ */ }
    }
    await connect();
  }

  function setProfile(name){
    var key = PRINTERS[name] ? name : 'tspl';
    if (key === printerKey) return;
    printerKey = key; printer = PRINTERS[key];
    try{ if (device && device.gatt.connected) device.gatt.disconnect(); }catch(e){}
    device = null; char = null;
    chunkSize = speed.chunk;
    status('เปลี่ยนเป็นเครื่อง ' + printer.label + ' — กรุณากดเชื่อมต่อใหม่');
  }

  async function writeChunk(part){
    for (var attempt = 0; attempt < 80; attempt++){
      try{
        if (char.properties.writeWithoutResponse) await char.writeValueWithoutResponse(part);
        else await char.writeValueWithResponse(part);
        return;
      }catch(e){
        if (!/in progress|busy/i.test(e.message || e.name)) throw e;
        await sleep(3 + attempt * 2);
      }
    }
    throw new Error('เครื่องปริ้นไม่ตอบสนอง');
  }

  async function sendBytes(bytes){
    var i = 0, last = 0;
    while (i < bytes.length){
      var eff = Math.min(chunkSize, printer.maxChunk || 1e9);
      var part = bytes.slice(i, i + eff);
      try{
        await writeChunk(part);
        i += part.length;
        if (i - last > 4000){ last = i; status('กำลังส่งข้อมูล ' + Math.round(i * 100 / bytes.length) + '%'); }
        var d = Math.max(speed.delay, printer.minDelay || 0);
        if (d) await sleep(d);
      }catch(e){
        if (eff > 20){
          chunkSize = chunkSize > 244 ? 244 : Math.max(20, chunkSize >> 1);
          await sleep(100);
        } else throw e;
      }
    }
  }

  function lumOf(px){ return function(i){ return 0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2]; }; }

  // หาความสูงจริงของเนื้อหา (ตัดแถวว่างด้านล่าง)
  function contentHeight(w, fullH, lum){
    var h = fullH;
    rows: for (; h > 1; h--){
      for (var x = 0; x < w; x++){ if (lum(((h - 1) * w + x) * 4) <= 150) break rows; }
    }
    return Math.min(fullH, h + 8);
  }

  function concat(parts){
    var n = 0; parts.forEach(function(a){ n += a.length; });
    var out = new Uint8Array(n), o = 0;
    parts.forEach(function(a){ out.set(a, o); o += a.length; });
    return out;
  }

  // คำสั่ง TSPL (QR380A)
  function toTSPL(cv, opts){
    var w = cv.width, fullH = cv.height, wb = w / 8;
    var px = cv.getContext('2d').getImageData(0, 0, w, fullH).data, lum = lumOf(px);
    var h = contentHeight(w, fullH, lum);
    var bmp = new Uint8Array(wb * h);
    for (var y = 0; y < h; y++){
      for (var x = 0; x < w; x++){
        if (lum((y * w + x) * 4) > 150) bmp[y * wb + (x >> 3)] |= (0x80 >> (x & 7)); // 1 = ขาว
      }
    }
    var enc = new TextEncoder();
    var xOff = Math.round((opts.marginLeftMm || 0) * DOTS_PER_MM);
    var head = enc.encode('SIZE ' + opts.widthMm + ' mm,' + opts.heightMm + ' mm\r\nGAP ' + opts.gapMm + ' mm,0 mm\r\nDIRECTION 1\r\nCLS\r\nBITMAP ' + xOff + ',0,' + wb + ',' + h + ',0,');
    var tail = enc.encode('\r\nPRINT 1,1\r\n');
    return concat([head, bmp, tail]);
  }

  // คำสั่ง PeriPage A6: เริ่มงาน + ภาพ raster (GS v 0) กว้าง 384 จุด แบ่งเป็นแถบละ 256 แถว + เลื่อนกระดาษ
  function toPeripage(cv, opts){
    var W = 384, wbT = W / 8;
    var w = cv.width, fullH = cv.height;
    var px = cv.getContext('2d').getImageData(0, 0, w, fullH).data, lum = lumOf(px);
    var h = contentHeight(w, fullH, lum);
    var xOff = Math.round((opts.marginLeftMm || 0) * DOTS_PER_MM);
    var bmp = new Uint8Array(wbT * h);
    for (var y = 0; y < h; y++){
      for (var x = 0; x < w; x++){
        if (lum((y * w + x) * 4) <= 150){          // 1 = ดำ
          var xx = x + xOff;
          if (xx < W) bmp[y * wbT + (xx >> 3)] |= (0x80 >> (xx & 7));
        }
      }
    }
    var parts = [new Uint8Array([0x10, 0xff, 0xfe, 0x01])];
    for (var y0 = 0; y0 < h; y0 += 256){
      var rws = Math.min(256, h - y0);
      parts.push(new Uint8Array([0x1d, 0x76, 0x30, 0x00, wbT & 255, wbT >> 8, rws & 255, rws >> 8]));
      parts.push(bmp.subarray(y0 * wbT, (y0 + rws) * wbT));
    }
    parts.push(new Uint8Array([0x1b, 0x4a, 0x40]));
    return concat(parts);
  }

  function toBytes(cv, opts){
    return printer.protocol === 'peripage' ? toPeripage(cv, opts) : toTSPL(cv, opts);
  }

  function loadHtml2Canvas(){
    if (global.html2canvas) return Promise.resolve();
    return new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = HTML2CANVAS; s.onload = res; s.onerror = function(){ rej(new Error('โหลด html2canvas ไม่สำเร็จ')); };
      document.head.appendChild(s);
    });
  }

  function options(o){ return Object.assign({}, defaults, o || {}); }

  async function elementToCanvas(el, opts){
    await loadHtml2Canvas();
    var contentMm = opts.widthMm - (opts.marginLeftMm || 0) - (opts.marginRightMm || 0);
    var targetW = Math.max(8, Math.round(contentMm * DOTS_PER_MM / 8) * 8);
    var scale = targetW / el.offsetWidth;
    var cv = await global.html2canvas(el, { scale: scale, backgroundColor: '#ffffff', useCORS: true });
    var out = document.createElement('canvas');
    out.width = targetW; out.height = Math.min(Math.round(cv.height * targetW / cv.width), Math.round(opts.heightMm * DOTS_PER_MM));
    var g = out.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
    g.drawImage(cv, 0, 0, targetW, cv.height * targetW / cv.width);
    return out;
  }

  function report(count, total, t0){
    var sec = Math.max(0.001, (performance.now() - t0) / 1000);
    status('ส่งแล้ว ' + count + ' ใบ · ' + (total / 1024).toFixed(0) + ' KB · ' + sec.toFixed(1) + ' วิ');
  }

  var BTPrint = {
    onStatus: null,
    connect: connect,
    ensureConnected: ensureConnected,
    isConnected: isConnected,
    setProfile: setProfile,
    getProfile: function(){ return printerKey; },
    setDefaults: function(o){ Object.assign(defaults, o); },
    setSpeed: function(name){ speed = SPEEDS[name] || SPEEDS.fast; chunkSize = speed.chunk; },
    printCanvas: function(cv, o){
      var opts = options(o);
      return enqueue(async function(){
        await ensureConnected();
        var t0 = performance.now(), bytes = toBytes(cv, opts);
        await sendBytes(bytes);
        report(1, bytes.length, t0);
      });
    },
    printElement: function(el, o){ return BTPrint.printElements([el], o); },
    printElements: function(els, o){
      var opts = options(o);
      return enqueue(async function(){
        await ensureConnected();
        if (!els.length) return;
        var t0 = performance.now(), total = 0;
        var next = elementToCanvas(els[0], opts);
        next.catch(function(){});
        for (var i = 0; i < els.length; i++){
          var cv = await next;
          if (i + 1 < els.length){ next = elementToCanvas(els[i + 1], opts); next.catch(function(){}); }
          var bytes = toBytes(cv, opts);
          total += bytes.length;
          await sendBytes(bytes);
        }
        report(els.length, total, t0);
      });
    }
  };
  global.BTPrint = BTPrint;
})(window);

</script>

function readSettingsForm() {
  const def = DEFAULTS[formPrinter];
  const isPeri = formPrinter === 'peripage';
  const num = (id, min, max, d) => {
    const v = parseFloat(document.getElementById(id).value);
    return isNaN(v) ? d : Math.min(max, Math.max(min, v));
  };
  const s = {
    widthMm: num('setWidth', 30, isPeri ? 48 : 120, def.widthMm),
    heightMm: isPeri ? 0 : num('setHeight', 20, 300, def.heightMm),
    marginLeftMm: num('setMarginLeft', 0, 20, def.marginLeftMm),
    marginRightMm: num('setMarginRight', 0, 20, def.marginRightMm),
    fontPct: num('setFont', 60, 200, def.fontPct),
    gapMm: isPeri ? 0 : num('setGap', 0, 10, def.gapMm),
    speed: document.getElementById('setSpeed').value
  };
  if (s.widthMm - s.marginLeftMm - s.marginRightMm < 20) {
    s.marginLeftMm = def.marginLeftMm;
    s.marginRightMm = def.marginRightMm;
  }
  return s;
}

window.openModal = function(modalId, tabName = 'login') {
  document.getElementById(modalId).style.display = 'block';

  }
};

window.closeModal = function(modalId) {

  // Clear errors
  document.getElementById('loginError').textContent = '';
  document.getElementById('registerError').textContent = '';

window.switchTab = function(tabName) {
  // Switch tabs in auth modal
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  if (tabName === 'login') {
    document.querySelector('.tab:nth-child(1)').classList.add('active');
    document.getElementById('loginTab').classList.add('active');
  } else {
    document.querySelector('.tab:nth-child(2)').classList.add('active');
    document.getElementById('registerTab').classList.add('active');
  }
};

window.login = async function() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const loginBtn = document.getElementById('loginBtn');
  const errorElement = document.getElementById('loginError');

  if (!email || !password) {
    errorElement.textContent = 'กรุณากรอกอีเมลและรหัสผ่าน';
    return;
  }

  try {
    loginBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> กำลังเข้าสู่ระบบ...';
    await signInWithEmailAndPassword(auth, email, password);
    closeModal('authModal');
  } catch (error) {
    console.error('Login error:', error);
    errorElement.textContent = getAuthErrorMessage(error.code);
  } finally {
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ';
  }
};

window.register = async function() {
  const email = document.getElementById('registerEmail').value;
  const password = document.getElementById('registerPassword').value;
  const confirmPassword = document.getElementById('registerConfirmPassword').value;
  const registerBtn = document.getElementById('registerBtn');
  const errorElement = document.getElementById('registerError');

  if (!email || !password || !confirmPassword) {
    errorElement.textContent = 'กรุณากรอกข้อมูลให้ครบทุกช่อง';
    return;
  }

  if (password !== confirmPassword) {
    errorElement.textContent = 'รหัสผ่านไม่ตรงกัน';
    return;
  }

    errorElement.textContent = 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร';
    return;
  }

  try {
    registerBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> กำลังสร้างบัญชี...';
    await createUserWithEmailAndPassword(auth, email, password);
    closeModal('authModal');
  } catch (error) {
    console.error('Registration error:', error);
    errorElement.textContent = getAuthErrorMessage(error.code);
  } finally {
    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> สร้างบัญชี';

function getAuthErrorMessage(errorCode) {
  switch(errorCode) {
    case 'auth/invalid-email':
      return 'อีเมลไม่ถูกต้อง';
    case 'auth/user-disabled':
      return 'บัญชีนี้ถูกระงับการใช้งาน';
    case 'auth/user-not-found':
      return 'ไม่พบผู้ใช้ที่ใช้อีเมลนี้';
    case 'auth/wrong-password':
      return 'รหัสผ่านไม่ถูกต้อง';
    case 'auth/email-already-in-use':
      return 'อีเมลนี้ถูกใช้งานแล้ว';
    case 'auth/weak-password':
      return 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร';
    default:
      return 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
  }
}

// Order Functions
window.loadOrders = async function() {
  if (!currentUser) return;

  try {
    // Load current orders
    const q = query(
      collection(db, "orders"),
      where("userId", "==", currentUser.uid),
      where("archived", "==", false),
      orderBy("date", "desc")
    );
    const querySnapshot = await getDocs(q);
    orderList = [];
    querySnapshot.forEach(docSnap => {
      const data = docSnap.data();
      data.date = new Date(data.date);
      data._docId = docSnap.id;
      orderList.push(data);
    });

    // อัปเดตตัวนับออเดอร์
    updateOrderCounter();
    updateCourierCounters();
    renderOrders();
    document.getElementById('currentOrdersSection').style.display = 'block';

    // Load archived orders
    const archiveQ = query(
      collection(db, "orders"),
      where("userId", "==", currentUser.uid),
      where("archived", "==", true),
      orderBy("date", "desc")
    );
    const archiveSnapshot = await getDocs(archiveQ);
    archivedOrderList = [];
    archiveSnapshot.forEach(docSnap => {
      const data = docSnap.data();
      data.date = new Date(data.date);
      data._docId = docSnap.id;
      archivedOrderList.push(data);
    });
  } catch (error) {
    console.error("Error loading orders:", error);
    alert("เกิดข้อผิดพลาดในการโหลดออเดอร์: " + error.message);
  }
};

window.addOrder = async function() {
  if (!currentUser) {
    alert('กรุณาเข้าสู่ระบบก่อนเพิ่มออเดอร์');
    return;
  }

  const customer = document.getElementById('customerData').value.trim();
  const courier = document.getElementById('courier').value;
  const shopPhone = document.getElementById('shopPhone').value;

  if (!customer) {
    alert('กรุณากรอกข้อมูลลูกค้า');
    return;
  }

  const phoneMatch = customer.match(/(020|030)\d{6,8}\b/);
  if (!phoneMatch) {
    alert('ไม่พบเบอร์โทรลูกค้า (รูปแบบ 020/030 ตามด้วยตัวเลข 6-8 หลัก)');
    return;
  }

  // ปริ้นอัตโนมัติ: ต่อเครื่องปริ้นก่อน (ต้องทำตอนที่ผู้ใช้เพิ่งกดปุ่ม)
  let autoPrint = isAutoPrint();
  if (autoPrint && !navigator.bluetooth) {
    alert('เบราว์เซอร์นี้ไม่รองรับการปริ้นบลูทูธ ระบบจะบันทึกออเดอร์โดยไม่ปริ้น');
    autoPrint = false;
  }
  if (autoPrint && !BTPrint.isConnected()) {
    try {
      await BTPrint.ensureConnected();
    } catch (e) {
      alert('เชื่อมต่อเครื่องปริ้นไม่สำเร็จ ระบบจะบันทึกออเดอร์โดยไม่ปริ้น');
      autoPrint = false;
    }
  }

  const id = 'BN' + phoneMatch[0];
  const date = new Date();
  const barcode = Math.floor(100000000000 + Math.random() * 900000000000);

  try {
    const ref = await addDoc(collection(db, "orders"), {
      id,
      customer,
      courier,
      date: date.toISOString(),
      barcode,
      shopPhone,
      userId: currentUser.uid,
      archived: false
    });
    document.getElementById('customerData').value = '';
    await loadOrders();
    if (autoPrint) {
      const order = { id, customer, courier, date, barcode, shopPhone };
      autoPrintQueue = autoPrintQueue.then(() => autoPrintAndArchive(order, ref.id));
    }
  } catch (error) {
    console.error("Error adding order:", error);
    alert("เกิดข้อผิดพลาดในการเพิ่มออเดอร์: " + error.message);
  }
};

window.searchArchivedOrders = function() {
  const orderIdQuery = document.getElementById('searchOrderId').value.trim().toLowerCase();
  const startDate = document.getElementById('searchStartDate').value;
  const endDate = document.getElementById('searchEndDate').value;

  let filteredOrders = [...archivedOrderList];

  // ค้นหาตามเลขออเดอร์
  if (orderIdQuery) {
    filteredOrders = filteredOrders.filter(order =>
      order.id.toLowerCase().includes(orderIdQuery)
    );
  }

  // ค้นหาตามวันที่
  if (startDate) {
    const start = new Date(startDate);
    filteredOrders = filteredOrders.filter(order =>
      new Date(order.date) >= start
    );
  }

  if (endDate) {
    const end = new Date(endDate);
    end.setHours(23, 59, 59, 999); // ตั้งเวลาเป็นสิ้นวัน
    filteredOrders = filteredOrders.filter(order =>
      new Date(order.date) <= end
    );
  }

  renderFilteredArchivedOrders(filteredOrders);
};

        <strong>ຂົນສົ່ງ:</strong> ${order.courier}
      </div>
    </div>

    <!-- ส่วนบาร์โค้ด (ไม่มีกรอบ, ชิดขอบบน) -->
    <div style="margin-top: 0; margin-bottom: 5px; text-align: center;">
      ${barcodeSVG}
      <div class="barcode-number" style="font-family: monospace; font-size: calc(11px * var(--fs, 1)); margin-top: 0px; letter-spacing: 1px;">
        ${order.barcode}
      </div>
    </div>

    <!-- ส่วนข้อมูลลูกค้า (ไม่มีกรอบ) -->
    <div style="margin-bottom: 5px;">
      <div style="font-weight: bold; margin-bottom: 3px;">
        ຂໍ້ມູນລູກຄ້າ:
      </div>
      <pre style="margin: 0; white-space: pre-wrap; font-size: calc(14px * var(--fs, 1)); line-height: 1.3;">${order.customer.replace(/\n/g, '<br>')}</pre>
    </div>

    <!-- ส่วนท้ายบิล -->
    <div style="text-align: center; font-weight: bold; color: #4361ee; margin-top: 5px; border-top: 1px solid #4361ee; padding-top: 5px;">
      ຂອບໃຈ💗
    </div>
  </div>
  `;
}

// ปริ้นผ่านเบราว์เซอร์ (ใช้สำรอง เมื่อเบราว์เซอร์ไม่รองรับ Web Bluetooth เช่นบนคอมพิวเตอร์)
window.printBillsBrowser = function(orders) {
  const win = window.open('', '_blank');
  win.document.write(`
    <html><head><title>Print Bills</title><style>
      @page { size: 80mm 150mm; margin: 0; }
      body { margin: 0; padding: 0; font-family: 'Noto Sans Lao', 'Noto Sans Thai', sans-serif; }
      .bill { width: 76mm; min-height: 130mm; padding: 10px; font-size: 14px; border: 1px solid #000; page-break-after: always; }
      .logo { font-size: 32px; font-weight: bold; display: inline-block; margin-right: 10px; }
      .shop-info { display: inline-block; vertical-align: middle; line-height: 1.4; white-space: nowrap; }
      .header { margin-bottom: 10px; }
      .section { margin-top: 10px; }
      .barcode-container { text-align: center; margin: 12px 0; }
      .barcode-number { text-align: center; font-family: monospace; font-size: 12px; margin-top: 5px; }
      .thankyou { text-align: center; margin-top: 20px; font-weight: bold; }
      pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; line-height: 1.4; }
    </style></head><body>
  `);
  orders.forEach(order => win.document.write(printBill(order)));
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(() => win.print(), 500);
};

// ปริ้นผ่านบลูทูธไปเครื่องปริ้น (หลายใบส่งต่อเนื่อง) — คืนค่า true ถ้าสำเร็จ
window.printBills = async function(orders) {
  if (!orders || !orders.length) return false;
  if (!navigator.bluetooth) {
    // เบราว์เซอร์ไม่รองรับบลูทูธ -> ใช้การปริ้นแบบเดิม
    printBillsBrowser(orders);
    return true;
  }
  const s = cur();
  const contentMm = s.widthMm - s.marginLeftMm - s.marginRightMm;
  const holder = document.createElement('div');
  holder.className = contentMm < 60 ? 'bt-narrow' : '';
  holder.style.cssText = 'position:absolute;left:-9999px;top:0;width:' + contentMm + 'mm;background:#fff;color:#000;--fs:' + (s.fontPct / 100) + ';';
  holder.innerHTML = orders.map(o =>
    '<div class="bt-bill" style="background:#fff;color:#000">' + printBill(o) + '</div>'
  ).join('');
  // ตัดกรอบนอกและความสูงขั้นต่ำออก ให้ความกว้างเท่าพื้นที่พิมพ์จริง (ตัวอักษรขนาดจริงตามมม.)
  const st = document.createElement('style');
  st.textContent =
    '.bt-bill .bill{border:none!important;min-height:0!important;margin:0!important;width:' + contentMm + 'mm!important;font-size:calc(14px * var(--fs, 1))!important;}' +
    '.bt-bill svg{max-width:100%;height:auto;}' +
    // กระดาษแคบ (เช่น PeriPage): จัดหัวบิลและวันที่/รหัสเรียงลงแทนเรียงข้าง
    '.bt-narrow .bill>div:first-child>div{flex-direction:column!important;align-items:flex-start!important;gap:4px;}' +
    '.bt-narrow .shop-info{text-align:left!important;white-space:normal!important;}' +
    '.bt-narrow .bill>div:nth-child(2)>div:first-child{flex-direction:column!important;gap:2px;}';
  holder.appendChild(st);
  document.body.appendChild(holder);
  // ให้บาร์โค้ด (SVG) ย่อตามความกว้างกระดาษได้
  holder.querySelectorAll('svg').forEach(sv => {
    if (!sv.getAttribute('viewBox')) {
      const w = parseFloat(sv.getAttribute('width')), h = parseFloat(sv.getAttribute('height'));
      if (w && h) sv.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
  });
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await BTPrint.printElements(
      Array.from(holder.querySelectorAll('.bt-bill')),
      { widthMm: s.widthMm, heightMm: s.heightMm || 300, marginLeftMm: s.marginLeftMm, marginRightMm: s.marginRightMm, gapMm: s.gapMm }
    );
    return true;
  } catch (e) {
    console.error(e);
    alert('ปริ้นไม่สำเร็จ: ' + e.message);
    return false;
  } finally {
    holder.remove();
  }
};

// ปริ้นออเดอร์ที่เพิ่งบันทึก แล้วเก็บเข้าคลังเมื่อปริ้นเสร็จ (ต่อคิว ไม่ให้ชนกัน)
let autoPrintQueue = Promise.resolve();
async function autoPrintAndArchive(order, docId) {
  const ok = await printBills([order]);
  if (!ok) return; // ปริ้นไม่สำเร็จ: ออเดอร์ยังอยู่ในรายการ ไม่เก็บเข้าคลัง
  try {
    await updateDoc(doc(db, "orders", docId), { archived: true });
    await loadOrders();
  } catch (error) {
    console.error("Error archiving after print:", error);
    alert('ปริ้นแล้ว แต่เก็บเข้าคลังไม่สำเร็จ: ' + error.message);
  }
}

window.printSelected = function() {
  const checkboxes = document.querySelectorAll('#orders input[type=checkbox]');
  const selected = Array.from(checkboxes).filter(c => c.checked).map(c => orderList[c.dataset.index]);
  if (!selected.length) return alert('กรุณาเลือกออเดอร์');
  printBills(selected);
};

window.printAll = function() {
  if (!orderList.length) return alert('ไม่มีออเดอร์');
  printBills(orderList);
};

window.printBillFromArchive = function(index) {
  const order = archivedOrderList[index];
  printBills([order]);
};

window.deleteSelected = async function() {
  const checkboxes = document.querySelectorAll('#orders input[type=checkbox]');
  const selected = Array.from(checkboxes).filter(c => c.checked);
  if (!selected.length) return alert('กรุณาเลือกออเดอร์ที่จะลบ');

  const confirmDelete = confirm('คุณแน่ใจว่าจะลบออเดอร์ที่เลือก?');
  if (!confirmDelete) return;

  try {
    for (const c of selected) {
      const index = c.dataset.index;
      const docId = orderList[index]._docId;
      await deleteDoc(doc(db, "orders", docId));
    }
    await loadOrders();
  } catch (error) {
    console.error("Error deleting orders:", error);
    alert("เกิดข้อผิดพลาดในการลบออเดอร์: " + error.message);
  }
};

window.archiveSelected = async function() {
  const checkboxes = document.querySelectorAll('#orders input[type=checkbox]');
  const selected = Array.from(checkboxes).filter(c => c.checked);
  if (!selected.length) return alert('กรุณาเลือกออเดอร์ที่จะเก็บเข้าคลัง');

  const confirmArchive = confirm('คุณแน่ใจว่าจะเก็บออเดอร์ที่เลือกเข้าคลัง?');
  if (!confirmArchive) return;

  try {
    for (const c of selected) {
      const index = c.dataset.index;
      const docId = orderList[index]._docId;
      await updateDoc(doc(db, "orders", docId), {
        archived: true
      });
    }
    await loadOrders();
    alert('เก็บออเดอร์เข้าคลังเรียบร้อยแล้ว');
  } catch (error) {
    console.error("Error archiving orders:", error);
    alert("เกิดข้อผิดพลาดในการเก็บออเดอร์เข้าคลัง: " + error.message);
  }
};

window.unarchiveOrder = async function(docId) {
  try {
    await updateDoc(doc(db, "orders", docId), {
      archived: false
    });
    await loadOrders();
    alert('นำออเดอร์ออกจากคลังเรียบร้อยแล้ว');
  } catch (error) {
    console.error("Error unarchiving order:", error);
    alert("เกิดข้อผิดพลาดในการนำออเดอร์ออกจากคลัง: " + error.message);
  }
};

window.showArchive = function() {
  document.getElementById('currentOrdersSection').style.display = 'none';
  document.getElementById('archiveSection').style.display = 'block';
  document.getElementById('searchOrderId').value = '';
  document.getElementById('searchStartDate').value = '';
  document.getElementById('searchEndDate').value = '';
  renderArchivedOrders();
};

window.backToCurrentOrders = function() {
  document.getElementById('currentOrdersSection').style.display = 'block';
  document.getElementById('archiveSection').style.display = 'none';
};
</script>
